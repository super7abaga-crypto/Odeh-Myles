<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>My Website</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <nav class="navbar">
    <div class="logo">Myles</div>

    <div class="nav-links">
        <a href="#users">Users</a>
        <a href="#create">Create User</a>
    </div>
</nav>
    <header class="header">
        <h1>Big_7.</h1>
        <p>Manage Your Users Easily</p>
    </header>

    <div class="stats">

    <div class="stat-card">
        <h3>Total Users</h3>
        <p id="userCount">0</p>
    </div>

    <div class="stat-card">
        <h3>System</h3>
        <p>Online</p>
    </div>

    <div class="stat-card">
        <h3>Version</h3>
        <p>1.0</p>
    </div>

</div>

 <section class="card">

    <h2 id="create">Create User</h2>

    <form id="userForm">

        <label for="name">Name:</label>
        <input type="text" id="name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <br><br>

        <button type="submit">Create User</button>

    </form>

    <div id="message" class="notification"></div>

</section>


<!-- Edit User Modal -->

<div id="editModal" class="modal">

    <div class="modal-content">

        <button type="button" id="closeModal" class="close-button">
            ×
        </button>

        <h2>Edit User</h2>

        <form id="editForm">

            <input type="hidden" id="editId">

            <label for="editName">Name:</label>
            <input type="text" id="editName" required>

            <br><br>

            <label for="editEmail">Email:</label>
            <input type="email" id="editEmail" required>

            <br><br>

            <label for="editRole">Role:</label>

    <select id="editRole">
            <option value="User">User</option>
            <option value="Admin">Admin</option>
            </select>

            <br><br>

            <button type="submit">Save Changes</button>

            <button type="button" id="cancelEdit">
                Cancel
            </button>

        </form>

    </div>

</div>


<!-- Users -->

<section class="card">

    <h2 id="users">Users</h2>

    <input
        type="text"
        id="searchInput"
        placeholder="Search users..."
    >

    <ul id="userList"></ul>

</section>


<!-- Delete User Modal -->

<div id="deleteModal" class="modal">

    <div class="modal-content">

        <button type="button" id="closeDeleteModal" class="close-button">
            ×
        </button>

        <h2>Delete User?</h2>

        <p id="deleteMessage"></p>

        <button type="button" id="confirmDelete">
            Delete
        </button>

        <button type="button" id="cancelDelete">
            Cancel
        </button>

    </div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
